edl:
  project: "ais-artemis-velocity-vis"
  target_edit_duration: 11.0
  viewport:
    width: 1920
    height: 1080
    dpr: 1.0

  scenes:
    - name: "scene_1_establishing"
      start_marker: "scene_1_establishing_start"
      end_marker: "scene_1_establishing_end"
      playback_speed: 1.2
      crop: null
      wow_level: "establishing"
      notes: "Pre-launch e-ink brutalist map overview, smooth slider adjustment to 30x"

    - name: "scene_2_rising"
      start_marker: "scene_2_rising_start"
      end_marker: "scene_2_rising_end"
      playback_speed: 1.3
      crop: null
      wow_level: "rising"
      notes: "NYC to SF flight across continental US with real-time HUD telemetry and map tracking"

    - name: "scene_3_climax"
      start_marker: "scene_3_climax_start"
      end_marker: "scene_3_climax_end"
      playback_speed: 1.35
      crop: null
      wow_level: "climax"
      notes: "London to Tokyo transcontinental flight across Eurasia at 55x speed with live HUD acceleration"

    - name: "scene_4_cooldown"
      start_marker: "scene_4_cooldown_start"
      end_marker: "scene_4_cooldown_end"
      playback_speed: 1.0
      crop: null
      wow_level: "cooldown"
      notes: "Arrival and complete telemetry readout inspection"

  transitions:
    - between: ["scene_1_establishing", "scene_2_rising"]
      type: "cut"
      duration: 0.0
    - between: ["scene_2_rising", "scene_3_climax"]
      type: "cut"
      duration: 0.0
    - between: ["scene_3_climax", "scene_4_cooldown"]
      type: "cut"
      duration: 0.0
